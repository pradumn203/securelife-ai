# nginx in front of the API inside the single container.
#
#   /api/, /docs, /openapi.json  -> uvicorn on 127.0.0.1:8001
#   /broker/                      -> broker dashboard build
#   /chat/                        -> prospect chat build
#   /                             -> redirect to /broker/
#
# Runs as a non-root user, so every writable path points at /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Policy PDFs are capped at 20 MB by the API; leave room for the form.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream api {
        server 127.0.0.1:8001;
    }

    server {
        listen 8000;
        root /app/static;

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The chat streams over server-sent events: pass tokens through as
            # they arrive instead of buffering the whole reply.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # Built assets are content-hashed: cache hard, and a missing one is a
        # real 404 rather than index.html.
        location ~ ^/(broker|chat)/assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /chat {
            return 301 /chat/;
        }

        location /chat/ {
            try_files $uri $uri/ /chat/index.html;
        }

        location = /broker {
            return 301 /broker/;
        }

        # Broker dashboard; unknown paths are client-side routes (/broker/leads/<id>).
        location /broker/ {
            try_files $uri $uri/ /broker/index.html;
        }

        location = / {
            return 302 /broker/;
        }

        location / {
            return 404;
        }
    }
}
